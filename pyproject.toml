[build-system]
requires = [
    "setuptools>=67.8.0",
    "wheel>=0.40.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "RCAIDE-GUI"
description = "RCAIDE Graphical User Interface: interactive desktop application for aircraft design and analysis"
readme = "README_PyPI.md"
requires-python = ">=3.9"
license = {text = "MIT License"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "RCAIDE-LEADS",
    "PyQt6>=6.9.0",
    "pyqtgraph>=0.14.0",
    "pyvista>=0.46.0",
    "pyvistaqt>=0.11.0",
    "qt-material>=2.17",
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "pandas",
    "pillow",
    "trimesh",
    "vtk",
    "contourpy",
    "cycler",
    "fonttools",
    "geographiclib",
    "geopy",
    "joblib",
    "kaleido",
    "python-dateutil",
    "pytz",
    "scikit-learn",
    "six",
    "tenacity",
    "threadpoolctl"
]
dynamic = ["version"]

[project.scripts]
rcaide-gui = "main:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tabs*", "common_widgets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (full mission evaluations) — deselect with -m 'not slow'",
]

[tool.setuptools.package-data]
"*" = [
    "app_data/images/*",
    "app_data/style_sheets/*",
    "app_data/defaults/*",
    "app_data/aircraft/*",
    "VERSION"
]
